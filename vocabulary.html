<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary Bank — Diplomatic Path</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1000px;margin:auto;padding:22px}.card,.hero{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 6px 20px #17203312}.hero{background:#172033;color:#fff}input,select{padding:12px;border:1px solid #dce1ea;border-radius:12px;font-size:16px;margin:4px;max-width:100%}.controls{display:flex;flex-wrap:wrap;gap:6px}.word{border-bottom:1px solid #edf0f5;padding:15px 0}.foreign{direction:ltr;text-align:left;font-size:21px;font-weight:700}.pron{color:#687287}.meta{font-size:12px;background:#eef1f7;border-radius:99px;padding:4px 8px;display:inline-block;margin:5px 2px}a{display:inline-block;background:#172033;color:#fff;text-decoration:none;padding:11px 15px;border-radius:12px}</style></head><body><main class="wrap"><section class="hero"><h1>📚 Vocabulary Bank</h1><p>بنك المفردات — ڤوكابيولَري بانك</p><p>ابحث وتصفّح مفردات الإنجليزية والفرنسية والإسبانية.</p></section><section class="card"><div class="controls"><select id="language"><option value="english">🇬🇧 English — الإنجليزية</option><option value="french">🇫🇷 French — الفرنسية</option><option value="spanish">🇪🇸 Spanish — الإسبانية</option></select><select id="level"><option value="all">كل المستويات</option><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option></select><select id="category"><option value="all">كل التصنيفات</option><option value="daily">الحياة اليومية</option><option value="geography">الجغرافيا</option><option value="politics">السياسة</option><option value="diplomacy">الدبلوماسية</option><option value="international-relations">العلاقات الدولية</option><option value="security">الأمن</option><option value="sea-beach">البحر والشاطئ</option><option value="supermarket">السوبر ماركت</option><option value="produce">الخضار والفواكه</option><option value="meat-poultry">اللحوم والدجاج</option><option value="home">المنزل والأجهزة</option><option value="restaurant-kitchen">المطاعم والمطبخ</option><option value="travel-hotel">السفر والفنادق</option><option value="health">الصحة والمستشفى</option><option value="work">العمل والشركات</option><option value="clothing">الملابس والتسوق</option><option value="transport">المواصلات والطرق</option></select><input id="search" placeholder="ابحث عن كلمة أو معنى..."></div><p id="count"></p></section><section class="card" id="words"></section><a href="index.html">العودة للرئيسية</a></main><script src="vocabulary-bank.js"></script><script src="vocabulary-a1-expansion.js"></script><script src="vocabulary-a2-expansion.js"></script><script src="vocabulary-expansion-batch-2.js"></script><script src="vocabulary-diplomacy-expansion.js"></script><script src="vocabulary-daily-life-expansion.js"></script><script src="vocabulary-encyclopedia-batch-1.js"></script><script>const L=document.getElementById("language"),V=document.getElementById("level"),C=document.getElementById("category"),S=document.getElementById("search"),W=document.getElementById("words"),N=document.getElementById("count"),requestedLanguage=new URLSearchParams(location.search).get("language");function render(){let e=DIPLOMATIC_VOCABULARY[L.value]||[],n=S.value.trim().toLowerCase();e=e.filter(e=>("all"===V.value||e.level===V.value)&&("all"===C.value||e.category===C.value)&&(!n||e.word.toLowerCase().includes(n)||e.arabic.includes(n)||e.pronunciation.includes(n))),N.textContent=`عدد النتائج: ${e.length}`,W.innerHTML=e.length?e.map(e=>`<div class="word"><div class="foreign">${e.word}</div><div>${e.arabic}</div><div class="pron">النطق: ${e.pronunciation}</div><span class="meta">${e.level}</span><span class="meta">${e.category}</span></div>`).join(""):"<p>لا توجد نتائج.</p>"}["english","french","spanish"].includes(requestedLanguage)&&(L.value=requestedLanguage),[L,V,C].forEach(e=>e.onchange=render),S.oninput=render,render()</script></body></html>
